<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product study</title>
<style>
  :root { --bg: #fafaf8; --card: #fff; --ink: #1b1b1f; --muted: #6b6b76; --line: #e3e3e8; --acc: #3b5bdb; --err: #c92a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
  .instructions { white-space: pre-wrap; }
  a.product { display: inline-block; margin-top: 8px; padding: 10px 14px; border-radius: 8px; background: var(--acc); color: #fff; text-decoration: none; font-weight: 600; word-break: break-all; }
  .q label.title { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea, input[type=number] { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  textarea { min-height: 96px; resize: vertical; }
  .scale { display: flex; gap: 8px; flex-wrap: wrap; }
  .scale button { flex: 1 1 48px; min-height: 44px; font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .scale button[aria-pressed=true] { background: var(--acc); border-color: var(--acc); color: #fff; }
  .scale-ends { display: flex; justify-content: space-between; margin-top: 4px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .opt input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
  .usd { display: flex; align-items: center; gap: 8px; }
  .usd span { font-weight: 600; }
  button.submit { width: 100%; min-height: 48px; font: inherit; font-weight: 700; color: #fff; background: var(--acc); border: 0; border-radius: 10px; cursor: pointer; }
  button.submit:disabled { opacity: .6; cursor: default; }
  .error { color: var(--err); font-weight: 600; }
  .q.missing { border-color: var(--err); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading the study…</p></main>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var CALLBACK = "https://terac.com/api/external/callback";
  var app = document.getElementById("app");
  var params = new URLSearchParams(location.search);
  var pathMatch = location.pathname.match(/\/study\/([^\/?#]+)/);
  var studyId = (pathMatch && decodeURIComponent(pathMatch[1])) || params.get("study_id") || "";
  var teracId = params.get("teracSubmissionId") || params.get("submissionId") || "";

  // Small DOM helper: text is always set with textContent, never innerHTML.
  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function message(title, body, isError) {
    app.replaceChildren(h("div", { class: "card" }, [
      h("h1", { text: title }),
      body ? h("p", { class: isError ? "error" : "muted", text: body }) : null,
    ]));
  }

  var cfg = window.VERA_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return message("Study unavailable", "This page is not configured yet.", true);
  if (!studyId) return message("Study not found", "This link is missing the study id.", true);
  var db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  db.from("studies").select("study_id,status,startup,plan").eq("study_id", studyId).maybeSingle()
    .then(function (res) {
      if (res.error) throw res.error;
      if (!res.data) return message("Study not found", "We couldn't find this study.", true);
      var s = res.data;
      if (["paid", "live", "collecting"].indexOf(s.status) < 0)
        return message("This study is closed", "It isn't accepting answers right now. Thanks for your interest.");
      render(s);
    })
    .catch(function (e) { message("Something went wrong", "Couldn't load the study: " + (e.message || e), true); });

  function render(s) {
    var plan = s.plan || {};
    var startup = s.startup || {};
    var questions = (plan.questions || []).concat(plan.wtp_questions || []);
    if (!questions.length) return message("Not ready yet", "This study has no questions yet. Please try again shortly.", true);
    var answers = {};
    var blocks = {};

    var intro = h("div", { class: "card" }, [
      h("h1", { text: "Try " + (startup.name || "the product") + " and share your feedback" }),
      plan.tester_instructions ? h("p", { class: "instructions", text: plan.tester_instructions }) : null,
      startup.product_url ? h("a", { class: "product", href: startup.product_url, target: "_blank", rel: "noopener noreferrer", text: "Open the product ↗" }) : null,
    ]);

    // Optional: which segment the tester belongs to, so results can be split by segment.
    var segments = (plan.segments || []).map(function (sg) { return sg.name; }).filter(Boolean);
    var segmentBlock = null;
    if (segments.length > 1) {
      var segQ = { id: "__segment", text: "Which of these describes you best?", type: "choice", options: segments.concat(["None of these"]) };
      segmentBlock = questionBlock(segQ, answers);
      blocks[segQ.id] = segmentBlock;
    }

    var form = h("form", { novalidate: "" });
    if (segmentBlock) form.appendChild(segmentBlock);
    questions.forEach(function (q, i) {
      var b = questionBlock(q, answers, i + 1);
      blocks[q.id] = b;
      form.appendChild(b);
    });
    var err = h("p", { class: "error", role: "alert" });
    var btn = h("button", { class: "submit", type: "submit", text: "Submit my answers" });
    form.appendChild(err);
    form.appendChild(btn);

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      err.textContent = "";
      var missing = Object.keys(blocks).filter(function (id) {
        var v = answers[id];
        var bad = v === undefined || v === "" || (typeof v === "number" && !isFinite(v));
        blocks[id].classList.toggle("missing", bad);
        return bad;
      });
      if (missing.length) { err.textContent = "Please answer every question (" + missing.length + " left)."; blocks[missing[0]].scrollIntoView({ behavior: "smooth", block: "center" }); return; }

      var payload = {};
      questions.forEach(function (q) { payload[q.id] = answers[q.id]; });
      var segment = answers.__segment && answers.__segment !== "None of these" ? answers.__segment : "";
      btn.disabled = true; btn.textContent = "Saving…";
      db.rpc("submit_response", { p_study_id: studyId, p_tester_id: teracId, p_segment: segment, p_answers: payload })
        .then(function (res) {
          if (res.error) throw res.error;
          if (teracId) {
            btn.textContent = "Saved. Returning you to Terac…";
            location.href = CALLBACK + "?teracSubmissionId=" + encodeURIComponent(teracId) + "&result=completed";
          } else {
            message("Thanks, you're done.", "Your answers were saved.");
          }
        })
        .catch(function (e) {
          btn.disabled = false; btn.textContent = "Submit my answers";
          err.textContent = "Couldn't save your answers: " + (e.message || e) + ". Please try again.";
        });
    });

    app.replaceChildren(intro, form);
  }

  function questionBlock(q, answers, n) {
    var name = "q_" + q.id;
    var block = h("div", { class: "card q" }, [h("label", { class: "title", text: (n ? n + ". " : "") + q.text })]);
    if (q.type === "scale_1_5") {
      var row = h("div", { class: "scale", role: "group" });
      [1, 2, 3, 4, 5].forEach(function (v) {
        var b = h("button", { type: "button", "aria-pressed": "false", text: String(v) });
        b.addEventListener("click", function () {
          answers[q.id] = v;
          row.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        });
        row.appendChild(b);
      });
      block.appendChild(row);
      block.appendChild(h("div", { class: "scale-ends muted" }, [h("span", { text: "1 = lowest" }), h("span", { text: "5 = highest" })]));
    } else if (q.type === "choice") {
      (q.options || []).forEach(function (opt) {
        var input = h("input", { type: "radio", name: name, value: opt });
        input.addEventListener("change", function () { answers[q.id] = opt; });
        block.appendChild(h("label", { class: "opt" }, [input, h("span", { text: opt })]));
      });
    } else if (q.type === "number_usd") {
      var num = h("input", { type: "number", inputmode: "decimal", min: "0", step: "0.01", placeholder: "0.00" });
      num.addEventListener("input", function () { answers[q.id] = num.value === "" ? undefined : Number(num.value); });
      block.appendChild(h("div", { class: "usd" }, [h("span", { text: "$" }), num]));
    } else {
      var ta = h("textarea", { name: name });
      ta.addEventListener("input", function () { answers[q.id] = ta.value.trim(); });
      block.appendChild(ta);
    }
    return block;
  }
})();
</script>
</body>
</html>
